domain_standards:
- id: gsma-sgp22-rsp
  name: GSMA SGP.22 (RSP Technical Specification — consumer eSIM Remote SIM Provisioning)
  conforms: true
  confidence: high
  evidence: >-
    The contract itself carries SGP.22 activation data verbatim, not merely eSIM marketing language. Response
    examples return `qrcode` values in the SGP.22 section 4.1 activation-code format
    "LPA:1$<SM-DP+ address>$<MatchingID>" — both a test value (LPA:1$lpa.airalo.com$TEST) and a production
    value (LPA:1$wbg.prod.ondemandconnectivity.com$Y7MRQ886FCDJD4RH, a Thales/Gemalto On-Demand
    Connectivity SM-DP+). The eSIM object exposes the SGP.22 field set directly — `iccid`, `lpa`
    (SM-DP+ address), `matching_id`, `confirmation_code`, `qrcode`, `qrcode_url`, `msisdn`,
    `apn_type`/`apn_value`, plus `direct_apple_installation_url` (the Apple universal eSIM install link for
    iOS 17.4+) and manual-install `smdp_address_and_activation_code` in the installation instructions.
  spec_locations:
  - openapi/airalo-partner-api-openapi.yml#getEsim
  - openapi/airalo-partner-api-openapi.yml#getInstallationInstructions
  - openapi/airalo-partner-api-openapi.yml#submitOrder
  market: eSIM / mobile connectivity
  note: >-
    This is the domain standard that matters for a consumer eSIM marketplace. An integrator who already
    speaks SGP.22 can render Airalo's activation payload with no bespoke connector: the QR content is a
    standards-conformant LPA string, not a proprietary token.
