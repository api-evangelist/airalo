  /v2/orders:
    get:
      summary: Get order list
      deprecated: false
      description: 'This endpoint allows you to retrieve a list of your orders from the Airalo Partners API. By using various filters, you can customize the results to match specific criteria. The access token, obtained from the "Request Access Token" endpoint, should be included in the request.


        For more information and best practices visit our FAQ page'
      tags:
      - REST API/Endpoints/Manage orders
      parameters:
      - name: include
        in: query
        description: Optional. A comma-separated string to include related data in the response. Possible values are "sims", "user", and "status".
        required: false
        example: sims,user,status
        schema:
          type: string
      - name: filter[created_at]
        in: query
        description: Optional. A string to filter orders by their creation date. Specify the date range using a dash (-) as a delimiter for correct parsing.
        required: false
        example: Y-m-d - Y-m-d
        schema:
          type: string
      - name: filter[code]
        in: query
        description: Optional. Filter orders by their order code. This performs a like search using the format '%ORDER_CODE%'.
        required: false
        example: 20221021-003188
        schema:
          type: string
      - name: filter[order_status]
        in: query
        description: 'Optional. A string to filter orders by their status. Possible values: "completed", "failed", "partially_refunded", and "refunded".'
        required: false
        example: completed
        schema:
          type: string
      - name: filter[iccid]
        in: query
        description: Optional. Filter orders by the sim's ICCID. This performs a like search using the format '%SIM_ICCID%'.
        required: false
        example: '891000000000001868'
        schema:
          type: string
      - name: filter[description]
        in: query
        description: Optional. A string to filter orders by their description. This performs a like search using the format '%DESCRIPTION%'.
        required: false
        example: Your order description
        schema:
          type: string
      - name: limit
        in: query
        description: Optional. An integer specifying how many orders will be returned on each page.
        required: false
        example: '50'
        schema:
          type: string
      - name: page
