  /v2/future-orders:
    get:
      summary: Future Orders
      deprecated: false
      description: 'This endpoint allows you to get all your submitted future orders that are in pending, failed or retry status

        The following filter parameters are available:


        - `status` (optional) - Defaults to pending. Other possible statuses are: failed and retry

        - `limit` (optional) - Defaults to 25. Limit the returned results

        - `from_due_date` - Datetime field in the format: Y-m-d H:i. Filters data starting from this date forward. Example: 2025-02-27 10:00

        - `to_due_date` - Datetime field in the format: Y-m-d H:i. Filters data starting from this date backward. Example: 2025-02-27 10:00


        Note that all already processed orders will not be displayed here.'
      tags:
      - REST API/Endpoints/Manage orders
      parameters:
      - name: status
        in: query
        description: 'Defaults to pending. Other possible status options: failed, retry'
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Limit the returned results
        required: false
        schema:
          type: string
      - name: from_due_date
        in: query
        description: 'Date in format: 2025-02-27 10:00'
        required: false
        schema:
          type: string
      - name: to_due_date
        in: query
        description: 'Date in format: 2025-02-27 10:00'
        required: false
        schema:
          type: string
      - name: Authorization
        in: header
        description: ''
        required: false
        example: Bearer {{token}}
        schema:
          type: string
      - name: url
        in: header
        description: ''
        example: https://partners-api.airalo.com
        schema:
