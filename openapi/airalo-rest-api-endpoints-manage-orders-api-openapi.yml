                      x-apidog-orders:
                      - request_id
                      - quantity
                      - description
                      - status
                      - package_id
                      - due_date
                      - latest_cancellation_date
                  links:
                    type: object
                    properties:
                      first:
                        type: string
                      last:
                        type: string
                      prev:
                        type: 'null'
                      next:
                        type: string
                    required:
                    - first
                    - last
                    - prev
                    - next
                    x-apidog-orders:
                    - first
                    - last
                    - prev
                    - next
                  meta:
                    type: object
                    properties:
                      message:
                        type: string
                      current_page:
                        type: integer
                      from:
                        type: integer
                      last_page:
                        type: integer
                      path:
                        type: string
                      per_page:
                        type: string
                      to:
                        type: integer
                      total:
                        type: integer
                    required:
                    - message
                    - current_page
                    - from
                    - last_page
                    - path
                    - per_page
                    - to
                    - total
                    x-apidog-orders:
                    - message
                    - current_page
                    - from
                    - last_page
                    - path
                    - per_page
                    - to
                    - total
                required:
                - data
                - links
                - meta
                x-apidog-orders:
                - data
                - links
                - meta
              examples:
                '1':
                  summary: Success
                  value:
                    data:
                    - request_id: ehFeHAa_R1GyIgHxNrP6Iz0Hy
                      quantity: 1
                      description: ''
                      status: pending
                      package_id: change-7days-1gb
                      due_date: 2025-03-24 10:00
                      latest_cancellation_date: 2025-03-23 10:00
                    - request_id: UPMpgaC9rWr799augw9KbI_ia
                      quantity: 1
                      description: ''
                      status: pending
                      package_id: change-7days-1gb
                      due_date: 2025-02-27 10:00
                      latest_cancellation_date: 2025-02-26 10:00
                    - request_id: -s5Cx8jTjvx2UH_euzhaHbwiu
                      quantity: 1
                      description: ''
                      status: pending
                      package_id: change-7days-1gb
                      due_date: 2025-02-27 10:00
                      latest_cancellation_date: 2025-02-26 10:00
                    links:
                      first: https://partners-api.airalo.com/v2/future-orders?filter%5B%27status%27%5D=%27failed%27&status=pending&page=1
                      last: https://partners-api.airalo.com/v2/future-orders?filter%5B%27status%27%5D=%27failed%27&status=pending&page=3
                      prev: null
                      next: https://partners-api.airalo.com/v2/future-orders?filter%5B%27status%27%5D=%27failed%27&status=pending&page=2
