    post:
      summary: Submit order
      deprecated: false
      description: "This endpoint allows you to submit an order to the Airalo Partner API by providing\
        \ the required parameters, such as `package_id` and `quantity`. You may also include an optional\
        \ `description` field to track your internal order ID or add any relevant notes related to the\
        \ order.\n\n\nFor more information and best practices visit our [FAQ page](https://developers.partners.airalo.com/faq-752238m0)\n\
        \nWhen submitting the order, the response includes the field `direct_apple_installation_url` with\
        \ installation instructions that now provide Apple’s universal link, enabling direct installation\
        \ on devices running iOS 17.4 or later for a smoother user experience.\n\n\nYou can also provide\
        \ your user’s email address using the `to_email` parameter, which will send an email to your user\
        \ asynchronously. The email uses a white-label template powered by our eSIM cloud feature. It\
        \ provides your users with a link to access and install the eSIM, includes installation instructions,\
        \ and supports multiple languages. \n\n<img src=\"https://lh3.googleusercontent.com/pw/AP1GczN6x9C8NVgjy_sptiiYf262zSJWxwWu1lgCss0YNHnw8s1FJeqECe2kCCXxy9BwJkaKM8v-ADXnILoeREKxQxYjUU55qapXoGsHIUtajxf_ARivNHVWSpzw0oQoyVmEpTNPq_AdIXGBMQmU5eS2cq1F=w504-h600-s-no-gm\"\
        \ style=\"border: 1px solid lightgrey;\"/>\n"
      tags:
      - REST API/Endpoints/Place order
      parameters:
      - name: Accept
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      - name: Authorization
        in: header
        description: ''
        required: true
        example: Bearer {{token}}
        schema:
          type: string
      - name: url
        in: header
        description: ''
        example: https://partners-api.airalo.com
        schema:
          type: string
          default: https://partners-api.airalo.com
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                quantity:
                  description: Required. The quantity of items in the order. Maximum of 50.
                  example: '1'
                  type: string
                package_id:
                  description: Required. The package ID associated with the order. You can obtain this
                    from the "Packages / Get Packages" endpoint.
                  example: kallur-digital-7days-1gb
                  type: string
                type:
                  description: Optional. The only possible value for this endpoint is "sim". If left empty,
                    default "sim" value will be used.
                  example: sim
                  type: string
                description:
                  description: Optional. A custom description for the order, which can help you identify
                    it later.
                  example: 1 sim kallur-digital-7days-1gb
                  type: string
                brand_settings_name:
                  description: Nullable. The definition under what brand the eSIM should be shared. Null
                    for unbranded.
                  example: our perfect brand
                  type: string
                to_email:
                  description: 'Optional. If specified, email with esim sharing will be sent. sharing_option
                    should be specified as well. '
                  example: valid_email@address.com
                  type: string
                sharing_option[]:
                  description: 'Optional. Array. Required when to_email is set. Available options: link,
                    pdf'
                  example: link
                  type: string
                copy_address[]:
                  description: Optional. Array. It uses when to_email is set.
                  example: valid_email@address.com
                  type: string
              required:
              - quantity
              - package_id
            examples: {}
