openapi: 3.0.1
info:
  title: Airalo Partner API
  description: Airalo Partner API (v2) — assembled verbatim from the per-endpoint OpenAPI 3.0.1 fragments
    Airalo publishes on its Apidog-hosted developer portal (each endpoint page carries an 'OpenAPI Specification'
    block). Fragments were merged path-by-path; nothing was authored.
  version: 1.0.0
servers:
- url: https://partners-api.airalo.com
  description: Prod Env
paths:
  /v2/cancel-future-orders:
    post:
      summary: Cancel future orders
      deprecated: false
      description: 'This endpoint allows you to submit future order cancellation requests via the Airalo
        Partner API.


        To proceed, provide an array of request_id strings from the "Create Future Order" endpoint response.


        Please note:

        - Future orders can be canceled up to 24 hours before the due date.

        - You can include up to 10 future orders in a single request.

        - An access token from the "Request Access Token" endpoint is required.


        For more information and best practices visit our [FAQ page](https://developers.partners.airalo.com/faq-752238m0)


        '
      tags:
      - REST API/Endpoints/Manage orders
      parameters:
      - name: Accept
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      - name: Authorization
        in: header
        description: ''
        required: true
        example: Bearer {{token}}
        schema:
          type: string
      - name: url
        in: header
        description: ''
        example: https://partners-api.airalo.com
        schema:
          type: string
          default: https://partners-api.airalo.com
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                request_ids:
                  type: array
                  items:
                    type: string
                  uniqueItems: true
              x-apidog-orders:
              - request_ids
              required:
              - request_ids
            example:
              request_ids:
              - wPnaOiEcdyP11pEPeJ-jLhT_I
              - Q2FMVdpbIAFh0RVvtjKkya8a1
              - OKjfHGS5qzRWzt74iKfm9YeVe
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: string
                  meta:
                    type: object
                    properties:
                      message:
                        type: string
                    required:
                    - message
                    x-apidog-orders:
                    - message
                required:
                - data
                - meta
                x-apidog-orders:
                - data
                - meta
              examples:
                '1':
                  summary: Success
                  value:
                    data: []
                    meta:
                      message: Future orders cancelled successfully
                '2':
                  summary: Validation errors
                  value:
                    data:
                      request_ids.1: Each request ID must be exactly 25 characters long.
                    meta:
                      message: the parameter is invalid
                '3':
                  summary: Already processed request ID
                  value:
                    data:
                      request_ids.0: 'Request ID: hjxVV6glJ9oTwieF4xeTgRuU6 is already processed and can
                        not be cancelled.'
                    meta:
                      message: the parameter is invalid
                '4':
                  summary: Request Id does not exist
                  value:
                    data:
                      request_ids.0: 'Request ID: hjxVV6glJ9oTwieF4xeTgRuU7 does not exist.'
                    meta:
                      message: the parameter is invalid
          headers: {}
          x-apidog-name: Success
        '422':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      request_ids.1:
                        type: string
                    required:
                    - request_ids.1
                    x-apidog-orders:
                    - request_ids.1
                    description: The data object provides specific error messags for each of the provided
                      request_ids, starting from index 0 which represents the first of the provided request_ids
                      in the array.. In this case "request_ids.1" represents the sercond request ID in
                      the array.
                  meta:
                    type: object
                    properties:
                      message:
                        type: string
                    required:
                    - message
                    x-apidog-orders:
                    - message
                required:
                - data
                - meta
                x-apidog-orders:
                - data
                - meta
          headers: {}
          x-apidog-name: Not valid request ID
        x-422:Already processed request ID:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      request_ids.0:
                        type: string
                    required:
                    - request_ids.0
                    x-apidog-orders:
                    - request_ids.0
                    description: The data object provides specific error messags for each of the provided
                      request_ids, starting from index 0 which represents the first of the provided request_ids
                      in the array.
                  meta:
                    type: object
                    properties:
                      message:
                        type: string
                    required:
                    - message
                    x-apidog-orders:
                    - message
                required:
                - data
                - meta
                x-apidog-orders:
                - data
                - meta
          headers: {}
          x-apidog-name: Already processed request ID
        x-422:Request Id does not exist:
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      request_ids.0:
                        type: string
                    required:
                    - request_ids.0
                    x-apidog-orders:
                    - request_ids.0
                  meta:
                    type: object
                    properties:
                      message:
                        type: string
                    required:
                    - message
                    x-apidog-orders:
                    - message
                required:
                - data
                - meta
                x-apidog-orders:
                - data
                - meta
          headers: {}
          x-apidog-name: Request Id does not exist
      security: []
      x-apidog-folder: REST API/Endpoints/Manage orders
      x-apidog-status: released
      x-run-in-apidog: https://app.apidog.com/web/project/742850/apis/api-14459873-run
      x-source-page: https://developers.partners.airalo.com/cancel-future-orders-14459873e0
