  /v2/simulator/webhook:
    post:
      summary: Webhook simulator
      deprecated: false
      description: ":::highlight blue \U0001F4A1\nThis endpoint comes with a Rate Limit:  **5 requests\
        \ per minute** per unique IP address. \n:::\n\nThe Webhook Simulator lets you trigger mock webhook\
        \ events directly to your configured endpoint **without placing real orders or consuming credit**.\
        \ Use it during integration to verify your webhook handler, signature verification, and payload\
        \ parsing for each event type before going live.\n\nThe following events are supported:\n  \n\
        - `low_data_notification` — simulates a data-usage or expiry alert on an eSIM\n- `credit_limit_notification`\
        \ — simulates a credit balance threshold alert\n- `async_order_notification` — simulates the webhook\
        \ sent after an asynchronous order completes\n\nFor more information and best practices visit\
        \ our [FAQ page](https://developers.partners.airalo.com/faq-752238m0)\n"
      tags:
      - REST API/Endpoints/Notifications
      parameters:
      - name: Authorization
        in: header
        description: ''
        required: true
        example: Bearer {{token}}
        schema:
          type: string
      - name: Accept
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      - name: url
        in: header
        description: ''
        example: https://partners-api.airalo.com
        schema:
          type: string
          default: https://partners-api.airalo.com
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                  description: 'Required. The webhook event type to simulate. Available options: **low_data_notification**,
                    **credit_limit_notification**, **async_order_notification**.'
