      summary: '[Deprecated] Get compatible device list'
      deprecated: false
      description: ":::warning\nThis endpoint is deprecated and will be eventually removed.  \nPlease\
        \ use `/v2/compatible-devices-lite` instead.\n:::\n\n\nThis endpoint provides a comprehensive\
        \ list of devices that are compatible with eSIMs. Use this information to ensure that your customers\
        \ have devices that support eSIM functionality.  \n\n#### Important Notes  \n- Include the access\
        \ token, obtained from the **Request Access Token** endpoint, in the request headers to authenticate\
        \ your API call.  \n- The returned list is regularly updated to include the latest compatible\
