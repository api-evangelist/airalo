  /v2/sims/{iccid}/packages:
    get:
      summary: Get  eSIM package history
      deprecated: false
      description: ":::highlight blue \U0001F4A1\n**This endpoint comes with a Rate Limit:** 10 requests\
        \ per minute per unique ICCID. \n:::\n\n\n**Note for unlimited packages** \n- For unlimited packages\
        \ the `remaining`, `total` and `amount` fields will default to `0` should be ignored, and not\
        \ displayed to the end users.\n- When in [Sandbox mode](https://developers.partners.airalo.com/sandbox-mode-2114305m0),\
        \ the `is_unlimited` field can be `false` for an unlimited package ordered, due to not having\
        \ real eSIMs available, thus don't reflect real usage.\n\n**GDPR and Data Storage** \nFor compliance\
        \ with GDPR and global privacy regulations, Airalo does not store any of your end-users' personally\
        \ identifiable information (PII). You are solely responsible for handling and storing all customer\
        \ data on your end.\n\n**Associating eSIMs with Customers** \nTo retrieve or manage all eSIMs\
        \ associated with a specific customer, you must store and map the customer's data to the ICCID\
        \ within your own system. The ICCID is the primary identifier for managing an eSIM post-purchase.\n\
        \n\n**Please, use a caching mechanism on the client side to deal with frequent customer requests.**\n\
        \n**To get and display this eSIM’s data package history, including top-ups:**\n\n\n- Make a request\
        \ to [GET eSIM package history](https://developers.partners.airalo.com/get-esim-package-history-11883032e0),\
        \ providing the `iccid` of the eSIM for which you want to retrieve top-up package for.\n- The\
        \ API will respond with a JSON object containing an array of purchased top-up packages for the\
        \ eSIM, each of which includes an ID, remaining data amount, activation and expiration dates,\
        \ and other relevant information.\n\nFor more information and best practices visit our [FAQ page](https://developers.partners.airalo.com/faq-752238m0)\n"
