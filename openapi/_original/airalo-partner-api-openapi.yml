  /v2/packages:
    get:
      summary: Get packages
      deprecated: false
      description: ":::highlight blue \U0001F4A1\nThis endpoint comes with a Rate Limit:  **80 requests\
        \ per minute to fetch packages** per unique authentication token. \n:::\n\nRetrieve a list of\
        \ local and global eSIM packages available through the Airalo Partners API. Local packages cover\
        \ a single country, while global packages span multiple countries and regions. This endpoint helps\
        \ you synchronize eSIM plans/packages with your system, ensuring newly introduced packages are\
        \ available to your clients and out-of-stock packages are handled properly.  \n## Features  \n\
        - **Package Types**: Supports standard data packages and the new \"Voice and Text\" packages.\
        \  \n- **Filtering**: Filter results by operator type or country code to tailor the package list\
        \ to your needs.  \n- **Pagination**: Adjust pagination settings to retrieve results in manageable\
        \ chunks.  \n- **Limit**: Set the `limit` parameter to a high value (e.g., 1,000) to fetch all\
        \ packages in a single request without using pagination.  \n- **Include Top-Up**: Use the `include:top-up`\
        \ parameter to fetch eSIM packages along with their associated top-up packages.  \n- **Multi language\
        \ support**:  Pass on the `Accept-language` header to get your response translated in the language\
        \ you prefer. All languages available in Sandbox and production mode are found in our [FAQs](faq-752238m0).\
        \ \n\n## Multi-Currency\nThis endpoint provides pricing information in multiple currencies for\
        \ both net prices and recommended retail prices. All currency conversion rates are updated once\
        \ daily at 00:00 UTC.\n\n## Minimum price per country\n\nEach country entry in the `data[]` array\
        \ includes a `min_price` object, giving the lowest available price for that destination. Use it\
        \ to render a \"from\" price on destination cards (e.g. \"France — from €4.13\") without pulling\
        \ the full package list and calculating the minimum yourself.\n\nExample:\n\n```json\n\"min_price\"\
        : {\n  \"recommended_retail_price\": { \"USD\": 4.50, \"EUR\": 4.13 },\n  \"net_price\": { \"\
        USD\": 2.25, \"EUR\": 2.06 }\n}\n```\n\n\n## Step-by-step implementation:\nTo keep your catalog\
        \ up to date, including stock availability, new packages, and pricing, while avoiding performance\
        \ or rate-limit issues, it’s important to run an hourly backend sync. \nBelow, we provide a step-by-step\
        \ guide to help you successfully sync your packages:\n\n### Hourly Sync\n- Set up a background\
        \ job via cron, worker, or cloud scheduler that calls GET /v2/packages **once every hour**.\n\
        - Include the required authentication header: `Authorization: Bearer <ACCESS_TOKEN>`  ([Refer\
        \ to Request access token](https://developers.partners.airalo.com/request-access-token-11883021e0))\n\
        \n### Single Full Fetch (No Limit Param)\n- Call the endpoint without a limit parameter to retrieve\
        \ the full catalogue (~3,200 packages) in a single response. This eliminates pagination and keeps\
        \ the sync logic straightforward.\n- Alternatively, you can implement pagination or split sync\
        \ runs (e.g. alternating between eSIMs and top-ups).\n\n### Rate-Limit Context\n- The API allows\
        \ up to 40 requests per minute. One request per hour is far below this threshold and safe to run\
        \ continuously.\n\n### Snapshot-Based Processing\n- Store the returned JSON as a complete snapshot\
        \ (file, object storage, or database).\n- Upsert packages using `package_id` as the unique key.\n\
        - Remove any packages missing from the latest snapshot.\n- Sync operators, coverage, pricing,\
        \ and metadata fields.\n\n## Throtlling policy\nIdentify unlimited packages with usage restrictions\
        \ by checking the `is_fair_usage_policy` boolean. If enabled, the `fair_usage_policy`  field contains\
        \ a string describing the specific limitations.\nExample:\n```\n\"is_fair_usage_policy\": true,\n\
        \"fair_usage_policy\": \"Lower speed rate of 1 Mbps after 3 GB usage per day.\"\n```"
      tags:
      - REST API/Endpoints/Browse packages
      parameters:
      - name: filter[type]
        in: query
        description: "Optional. A string to filter packages by operator type. Possible values are \"local\"\
          \ and \"global\".\n  \nIf the filter is set to \"global,\" the output will include only global\
          \ and regional eSims. Global and regional packages do not use the \"country_code\" field, which\
          \ will be empty. The \"type\" field in the operator object within the response will be set to\
          \ \"global.\" A package is considered worldwide if its \"slug\" field is set to \"world\" and\
          \ regional if \"slug\" contains a region name, for example, \"europe\" or \"Africa\".\n  \n\
          If the filter is set to \"local,\" the response will contain only country-specific packages.\
          \ To get the list of packages for a single country, you can use it in combination with filter[country]\
          \ parameter. The \"type\" field in the operator object of the response will indicate a \"local\"\
          \ type.\n  \nIf no filter is set, the response includes all eSIM types (local, regional, and\
          \ global) and may return 200+ packages. Results are paginated, retrieve all pages to return\
          \ the full list."
        required: false
        example: global
        schema:
          type: string
      - name: filter[country]
        in: query
        description: Optional. A string to filter packages by country code. Examples include US, DE, GB,
          IT, and UA.
        required: false
        example: TR
        schema:
          type: string
      - name: limit
        in: query
        description: Optional. An integer specifying how many items will be returned on each page.
        required: false
        example: ''
        schema:
          type: string
      - name: page
        in: query
        description: "Optional. An integer specifying the pagination's current page. \nIf the page is\
          \ set to 2 or beyond, the response will have different format and contain an object representing\
          \ the country's index in the list of packages."
        required: false
        example: '1'
        schema:
          type: string
      - name: include
        in: query
        description: Optional. Valid value is topup. Includes topup packages to the response
        required: false
        example: topup
        schema:
          type: string
      - name: Accept
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      - name: Authorization
        in: header
        description: ''
        required: true
        example: Bearer {{token}}
        schema:
          type: string
      - name: Accept-Language
        in: header
        description: ''
        required: false
        example: en
        schema:
          type: string
      - name: url
        in: header
        description: ''
        example: https://partners-api.airalo.com
        schema:
          type: string
          default: https://partners-api.airalo.com
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties: {}
            examples: {}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  pricing:
                    type: object
                    properties:
                      model:
                        type: string
                      discount_percentage:
                        type: integer
                    required:
                    - model
                    - discount_percentage
                    x-apidog-orders:
                    - model
                    - discount_percentage
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        slug:
                          type: string
                        country_code:
                          type: string
                        title:
                          type: string
                        image:
                          type: object
                          properties:
                            width:
                              type: integer
                            height:
                              type: integer
                            url:
                              type: string
                          required:
                          - width
                          - height
                          - url
                          x-apidog-orders:
                          - width
                          - height
                          - url
                        min_price:
                          type: object
                          properties:
                            net_price:
