  /v2/voucher/esim:
    post:
      summary: eSIM voucher
      deprecated: false
      description: "**Overview:**\nThe eSIM voucher endpoint lets you purchase Airalo eSIM activation\
        \ codes individually or in bulk. You can store these codes as inventory and distribute them to\
        \ customers through your own channels (e.g., website, app, email, CRM). Customers redeem the code\
        \ on the Airalo app or [Airalo website](https://www.airalo.com/) to install and activate the eSIM.\n\
        \n**Why choose vouchers:**\nVouchers offer a fast go‑to‑market path to provide connectivity without\
        \ implementing a full eSIM purchase and management flow. You can offer connectivity through eSIM\
        \ vouchers or Airmoney vouchers, while Airalo provides 24/7 customer support in 53 languages,\
        \ has a 90+ CSAT score, and takes full responsibility and liability for connectivity.\n\n**How\
        \ to use this endpoint:**\nThis endpoint is a good fit if you want to resell eSIMs (buy codes\
        \ at partner rates and set your own pricing), embed voucher fulfillment into your customer journey\
        \ (e.g., post‑purchase delivery), or manage inventory by buying in bulk and distributing codes\
        \ on demand. For order reconciliation, you can pass an optional `booking_reference` to link each\
        \ purchase to your internal order ID. Requests are sent as an array of voucher items—each specifying\
        \ a `package_id` and quantity—and the response returns activation codes you can deliver to your\
        \ customers.\n\nThis endpoint allows you to create an esim voucher to the Airalo Partners API.\
        \ Provide the required information, such as quantity and package ID. The access token, obtained\
        \ from the \"Request Access Token\" endpoint, should be included in the request. \n\nFor more\
        \ information and best practices visit our [FAQ page](https://developers.partners.airalo.com/faq-752238m0).\n\
        \n**Body structure:**\n\n``` json\n{\n    \"vouchers\": [\n        {\n            \"package_id\"\
        : \"replace with actual package slug\",\n            \"quantity\": 3,\n            \"booking_reference\"\
        : \"123\"\n        }\n    ]\n}\n\n ```\n\n**Request parameters:**\n\n- **vouchers** (array, required):\n\
        \    \n    - An array of voucher objects to be created for eSIMs. Each voucher object contains\
        \ the following fields:\n        \n        - **package_id** (string, required):\n            \n\
        \            - The unique identifier (slug) of the eSIM package for which the voucher is being\
        \ issued.\n                \n            - Example: \"package_id\": \"eu-europe-5gb-30days\"\n\
        \                \n        - **quantity** (integer, required):\n            \n            - The\
        \ number of vouchers you wish to purchase for the specified package.\n                \n     \
        \       - Example: \"quantity\": 3\n                \n        - **booking_reference** (string,\
        \ optional):\n            \n            - A field used to store the booking reference for this\
        \ voucher, which can be used for tracking purposes in your own system.\n                \n   \
        \         - Example: \"booking_reference\": \"123\"\n                \n            - If not provided,\
        \ this field will be ignored."
      tags:
      - REST API/Endpoints/Place order
      parameters:
      - name: Authorization
        in: header
        description: ''
        required: true
        example: Bearer {{token}}
        schema:
          type: string
      - name: Content-Type
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      - name: url
        in: header
        description: ''
        example: https://partners-api.airalo.com
        schema:
          type: string
          default: https://partners-api.airalo.com
      responses:
        '200':
          description: ''
          content:
            '*/*':
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        package_id:
                          type: string
                        codes:
                          type: array
                          items:
                            type: string
                        booking_reference:
                          type: string
                      required:
                      - package_id
                      - codes
                      - booking_reference
                      x-apidog-orders:
                      - package_id
                      - codes
                      - booking_reference
                  meta:
                    type: object
                    properties:
                      message:
                        type: string
                    required:
                    - message
                    x-apidog-orders:
                    - message
                required:
                - data
                - meta
                x-apidog-orders:
                - data
                - meta
              examples:
                '1':
                  summary: Esim voucher
                  value: "{\n    \"data\": [\n        {\n            \"package_id\": \"jaco-mobile-7days-1gb\"\
                    ,\n            \"codes\": [\n                \"BIXLAAAA\",\n                \"BSXLAAAA\"\
                    \n            ],\n            \"booking_reference\": \"123\"\n        },\n       \
                    \ {\n            \"package_id\": \"liberation-mobile-30days-3gb\",\n            \"\
                    codes\": [\n                \"1HKGDUMP\"\n            ],\n            \"booking_reference\"\
                    : \"123\"\n        }\n    ],\n    \"meta\": {\n        \"message\": \"success\"\n\
                    \    }\n}"
                '2':
                  summary: Esim voucher error
                  value: "{\n    \"data\": {\n        \"vouchers.0.package_id\": \"The selected vouchers.0.package_id\
                    \ is invalid\"\n    },\n    \"meta\": {\n        \"message\": \"the parameter is invalid\"\
                    \n    }\n}"
          headers: {}
          x-apidog-name: Esim voucher
        x-200:Esim voucher error:
          description: ''
          content:
            '*/*':
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      vouchers.0.package_id:
                        type: string
                    required:
                    - vouchers.0.package_id
                    x-apidog-orders:
                    - vouchers.0.package_id
                  meta:
                    type: object
                    properties:
                      message:
                        type: string
                    required:
                    - message
                    x-apidog-orders:
                    - message
                required:
                - data
                - meta
                x-apidog-orders:
                - data
                - meta
          headers: {}
          x-apidog-name: Esim voucher error
      security: []
      x-apidog-folder: REST API/Endpoints/Place order
      x-apidog-status: released
      x-run-in-apidog: https://app.apidog.com/web/project/742850/apis/api-11883065-run
      x-source-page: https://developers.partners.airalo.com/esim-voucher-11883065e0
  /v2/future-orders:
    post:
      summary: Future orders
      deprecated: false
      description: "This endpoint allows you to submit an order to the Airalo Partner API, which will\
        \ be created on the specified due date.\n\nTo proceed, provide the required information:\n- Due\
        \ date\n- Quantity\n- Package ID\n- Description (optional)\n\nPlease note:\n- On success, the\
        \ endpoint response will include a unique 25-character request_id.\n- You must store this value\
        \ in your system to cancel the order later if needed and to know for which order you got a response\
        \ on your webhook URL.\n- An access token from the \"Request Access Token\" endpoint is required\
        \ in the request.\n\n\n**Delivery modes**\n**What is a webhook URL?**\nWebhook URL is a URL that\
        \ is configured on your domain and your won webserver.\nThat URL should be able to receive HTTP\
        \ POST requests with your order data that will be sent from our servers .\nNOTE: We check the\
        \ liveness of your webhook URL with an HTTP HEAD request to which we expect 200 OK response.\n\
        \n**What happens when the due date arrives?**\nWhen the due date arrives your order is processed\
        \ and the order details are sent as a POST HTTP request to \neither your opted in \"async_orders\"\
        \ notification type url (more info [here](https://partner-api-airalo.apidog.io/async-orders-11883038e0)\
        \ )\nor on the \"webhhok_url\" optional parameter of this endpoint which overrides the above opted\
        \ in URL.\nNOTE that you must have one of the above (either opted in URL or webhhok_url) provided\
        \ in order to make a future order.\n\nif you provide the optional parameter \"sharing_option\"\
        , which goes together with the \"to_email\" parameter \nthen an email with the eSim details will\
        \ also be sent to the email provided in the \"to_email\" parameter as well.\nDepending from the\
        \ selected sharing option which can be one of link or pdf or both you will get the eSim data \n\
        either in a PDF format attached to the email or as a link.\n\n**What is the format of the message\
        \ that is sent to the webhook URL?**\nThe format of the message that is sent to the webhook URL\
        \ is the same as the response of the [regular order](https://partner-api-airalo.apidog.io/submit-order-11883024e0).\n\
        It only has one additional parameter named \"request_id\" which is the same request_id that you\
        \ got in the response \nwhen you made the future order at the time of making the order, \nso that\
        \ you know for which future order you got details on your webhook URL.\n\n\n**SANBOX MODE**\n\n\
        NOTE that this endpoint has a slightly different behaviour in sandbox mode.\nHere are the differences.\n\
        1. In sandbox mode the future orders will not be processed on the actual due date but they will\
        \ be processed immediatelly upon submission.\n2. Because the future orders are not processed on\
        \ the due date, their status is always processed so in order to simulate future orders with other\
        \ statuses there are 3 special packages for that. Here are the pacakges with the explanations:\n\
        \    - `test-create-pending-future-order-7days-1gb` - special package for creating a future order\
        \ with pending status\n    - `test-create-failed-future-order-7days-1gb` - special package for\
        \ creating a future order with failed status\n    - `test-create-retry-future-order-7days-1gb`\
        \ - special package for creating a future order with retry status \n\nBy using the packages above\
        \ future orders with the above statuses can be created and the `request_id` from those orders\
        \ can be used to test the [cancel future order API](https://app.apidog.com/link/project/742850/apis/api-14459873)\
        \ to cancel the future order.\n\nBy using the above packages you can also test the [GET future\
        \ orders API Endpoint](https://app.apidog.com/link/project/742850/apis/api-21307288?branchId=1052533)\
        \ to test the filters as well."
      tags:
      - REST API/Endpoints/Place order
