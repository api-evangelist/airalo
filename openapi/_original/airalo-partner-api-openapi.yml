      summary: Submit top-up order
      deprecated: false
      description: "**To submit a top-up order:**\n\nThis endpoint allows you purchase a top-up package\
        \ for a specific eSIM providing the below parameters to your request: \n\n1) `package_id`: The\
        \ ID of the top-up package you want to purchase.\n\n2) `iccid`: The ICCID of the eSIM for which\
        \ you want to purchase the top-up package.\n\nYou can also include an optional `description` field\
        \ to provide additional information about the order.\n\nThe API will respond with a JSON object\
        \ containing the details of the order, including the package ID, quantity, price, and other relevant\
        \ information.\n\n**The complete workflow for buying a top-up package:**\n\n1) Call the [GET eSIMS\
        \ list](/get-esims-list-11883027e0) to see the list of previously purchased eSIMs  \n2) Call the\
        \ [Get top-up package list](/get-top-up-package-list-11883031e0) to see the list of available\
        \ top-ups for the eSIM providing its `iccid` you retrieved from point 1.\n3) Submit an order on\
        \ [Submit top-up order](/submit-top-up-order-11883026e0) endpoint\n with the `iccid` you wish\
        \ to buy the top-up package for, and provide also `package_id`of the top-up package to purchase.\n\
        4) Call the [Get eSIM package history](/get-esim-package-history-11883032e0) endpoint\n to see\
        \ the list of all packages bought for that eSIM.\n\nFor more information and best practices visit\
        \ our [FAQ page](https://developers.partners.airalo.com/faq-752238m0)\n"
