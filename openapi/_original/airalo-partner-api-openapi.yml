  /v2/sims:
    get:
      summary: Get eSIMs list
      deprecated: false
      description: ":::highlight blue \U0001F4A1\n**GDPR and Data Storage** \nFor compliance with GDPR\
        \ and global privacy regulations, Airalo does not store any of your end-users' personally identifiable\
        \ information (PII). You are solely responsible for handling and storing all customer data on\
        \ your end.\n\n**Associating eSIMs with Customers** \nTo retrieve or manage all eSIMs associated\
        \ with a specific customer, you must store and map the customer's data to the ICCID within your\
        \ own system. The ICCID is the primary identifier for managing an eSIM post-purchase.\n:::\n\n\
        This endpoint allows you to retrieve a list of your eSIMs from the Airalo Partners API. You can\
        \ customize the results using various filters and include related data in the response by specifying\
        \ optional parameters.\n\nThe access token, obtained from the \"Request Access Token\" endpoint,\
        \ should be included in the request.\n\n`direct_apple_installation_url`: Partner API now supports\
        \ direct installation on iOS devices. With the introduction of Universal Links by Apple, users\
        \ with iOS 17.4 or higher can directly install eSIMs using a special URL, which can be provided\
        \ to your end clients if they are using iOS version 17.4 or above.\n\n"
      tags:
      - REST API/Endpoints/Manage eSIMs
      parameters:
      - name: include
        in: query
        description: Optional. A comma-separated string to include related data in the response. Possible
          values are "order", "order.status", "order.user" and "share".
        required: false
        example: order,order.status,order.user,share
        schema:
          type: string
      - name: filter[created_at]
        in: query
        description: Optional. A string to filter eSIMs by their creation date. Specify the date range
          using a dash (-) as a delimiter for correct parsing.
        required: false
        example: Y-m-d - Y-m-d
        schema:
          type: string
      - name: filter[iccid]
        in: query
        description: Optional. A string to filter eSIMs by their ICCID. This performs a like search using
          the format '%SIM_ICCID%'.
        required: false
        example: '8944465400000217735'
        schema:
          type: string
      - name: limit
        in: query
        description: Optional. An integer specifying how many sims will be returned on each page.
        required: false
        example: '100'
        schema:
          type: string
      - name: page
        in: query
        description: Optional. An integer specifying the pagination's current page.
        required: false
        example: '1'
        schema:
          type: string
      - name: Accept
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      - name: Authorization
        in: header
        description: ''
        required: true
        example: Bearer {{token}}
        schema:
          type: string
      - name: url
        in: header
        description: ''
        example: https://partners-api.airalo.com
        schema:
          type: string
          default: https://partners-api.airalo.com
