  /v2/sims/{iccid}/topups:
    get:
      summary: Get  top-up package list
      deprecated: false
      description: "**Overview**\nUse this endpoint to retrieve the top-up packages that can be purchased\
        \ for a specific eSIM. When you call the endpoint with an eSIM’s ICCID, the response returns the\
        \ eligible top-up packages for that eSIM (based on the ICCID provided). The endpoint supports\
        \ new type of packages: “Voice and Text”.\nThis endpoint is designed for the top-up flow: it helps\
        \ you present only the top-ups that are actually available for the eSIM’s operator/configuration,\
        \ along with the package details you need to display and sell them (e.g., package ID, price, data\
        \ amount, and duration).⁠\n\n**Note for unlimited packages** \n- For unlimited packages the `remaining`,\
        \ `total` and `amount` fields will default to `0` should be ignored, and not displayed to the\
        \ end users.\n- When in [Sandbox mode](https://developers.partners.airalo.com/sandbox-mode-2114305m0),\
        \ the `is_unlimited` field can be `false` for an unlimited package ordered, due to not having\
        \ real eSIMs available, thus don't reflect real usage.\n\n**How to use this endpoint**\n\n- Make\
        \ a request to this endpoint and provide the `iccid` of the eSIM for which you want to retrieve\
        \ top-up packages for.\n- The API will respond with a JSON object containing an array of purchased\
        \ top-up packages for the eSIM, each of which includes an ID, remaining data amount, activation\
        \ and expiration dates, and other relevant information.\n\n\nFor more information and best practices\
        \ visit our [FAQ page](https://developers.partners.airalo.com/faq-752238m0)."
