  /v2/packages/{package_slug}/product-information:
    get:
      summary: Get Product Information (PIB)
      deprecated: false
      description: "\n:::highlight blue \U0001F4A1\nThis endpoint comes with a Rate Limit:  **60 requests\
        \ per minute** per company and per unique package. \n:::\n\n**Overview**\nRetrieve the standardized\
        \ **Product Information** for a single eSIM package on the Airalo Partners API. Pass the package's\
        \ `package_slug` in the path and the endpoint returns a structured, regulator-ready summary of\
        \ that package — services included, data allowance, validity, speeds, pricing, throttling/fair-usage\
        \ rules, and the partner & legal entity details — along with a versioned, downloadable Product\
        \ Information Brochure (PIB) PDF.\n\nThis endpoint is designed to help you surface a clear, consistent\
        \ product summary to your end customers (and to meet pre-sale transparency requirements) without\
        \ assembling those details yourself from the packages catalogue.\n\n## Features\n- **Single package\
        \ lookup**: Returns the full product information for one package, identified by its `package_slug`.\n\
        - **Versioning**: Every response carries a `pib_version`, `pib_version_date`, and a `version_hash`.\
        \ When a package's underlying details change, a new version is generated automatically; if nothing\
        \ has changed, the same version and hash are returned (idempotent).\n- **Downloadable brochure**:\
        \ `pib_version_pdf_link` provides a link to the generated Product Information Brochure (PDF) for\
        \ the current version.\n- **Throttling & fair-usage transparency**: `is_fair_usage_policy`, `fair_usage_policy`,\
        \ throttle speeds, and `throttle_threshold_mb` describe any usage restrictions on unlimited packages.\n\
        \n## How to use this endpoint\n- Make a `GET` request to this endpoint and provide the `package_slug`\
        \ of the package you want product information for (e.g. `change-7days-1gb`).\n- Include the required\
        \ authentication header: `Authorization: Bearer <ACCESS_TOKEN>` ([Refer to Request access token](/request-access-token-11883021e0)).\n\
        - The API responds with a single JSON object containing the package's product attributes, versioning\
        \ metadata, partner/legal details, and a link to the generated PDF brochure.\n\n## Response highlights\n\
        - **Service flags**: `service_internet`, `service_telephony`, `service_sms` indicate which services\
        \ the package includes.\n- **Allowance & validity**: `data_allowance_mb`, `data_allowance_display`,\
        \ `validity_days`, `voice_minutes`, `sms_included`, and `is_unlimited`.\n- **Network**: `network_providers`\
        \ and `network_technologies` (e.g. 4G/5G) describe coverage and supported technology.\n- **Speeds**:\
        \ `max_download_speed_mbit`, `max_upload_speed_mbit`, and the throttled equivalents after the\
        \ fair-usage threshold is reached.\n- **Pricing**: `retail_price_eur` and `out_of_bundle_rate_eur_per_mb`.\n\
        - **Legal & partner info**: `partner_brand_name`, `partner_logo_url`, `legal_entity_name`, `legal_address`,\
        \ `terms_url`, and `auto_renewal`.\n\n\n\n**Note**\n- An invalid or unknown `package_slug` returns\
        \ a `404 Not Found`.\n- For unlimited packages, allowance fields may default to `Unbegrenzt `\
        \ and should be interpreted alongside `is_unlimited` and the fair-usage fields rather than shown\
        \ as a literal limit.\n"
