  /v2/notifications/opt-out:
    post:
      summary: Opt out
      deprecated: false
      description: This endpoint allows you to opt out of notifications regarding low data usage.
      tags:
      - 'REST API/Endpoints/Notifications/Notification: Low data'
      parameters:
      - name: Accept
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      - name: Authorization
        in: header
        description: ''
        required: true
        example: Bearer {{token}}
        schema:
          type: string
      - name: url
        in: header
        description: ''
        example: https://partners-api.airalo.com
        schema:
          type: string
          default: https://partners-api.airalo.com
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
              required:
              - type
              x-apidog-orders:
              - type
            examples:
              'Notification: Low data':
                value: "{ \n    \"type\": \"webhook_low_data\" //email_low_data, email_credit_limit, webhook_low_data, webhook_credit_limit\n}"
              'Notification: Credit limit':
                value:
                  type: webhook_credit_limit
              'Notification: Async orders':
                value:
                  type: async_orders
      responses:
        '204':
          description: ''
          content:
            '*/*':
              schema:
                type: object
                properties: {}
                x-apidog-orders: []
          headers: {}
          x-apidog-name: Opt out notification on low data
      security: []
      x-apidog-folder: 'REST API/Endpoints/Notifications/Notification: Low data'
      x-apidog-status: released
      x-run-in-apidog: https://app.apidog.com/web/project/742850/apis/api-11883040-run
