paths:
  /v2/notifications/opt-in:
    get:
      summary: Get notification details
      deprecated: false
      description: 'This endpoint allows you to retrieve the details of `Low data notification` from the Airalo partner API. If the below highlighted response is returned, it means you are successfully opted in for the notification.


        The access token, obtained from the Request Access Token endpoint, should be included in the request.'
      tags:
      - 'REST API/Endpoints/Notifications/Notification: Low data'
      parameters:
      - name: Accept
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      - name: Authorization
        in: header
        description: ''
        required: true
        example: Bearer {{token}}
        schema:
          type: string
      - name: url
        in: header
        description: ''
        example: https://partners-api.airalo.com
        schema:
          type: string
          default: https://partners-api.airalo.com
      responses:
        '200':
          description: ''
          content:
            '*/*':
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      notification:
                        type: object
                        properties:
                          type:
                            type: string
                          contact_point:
                            type: string
                        required:
                        - type
                        - contact_point
                        x-apidog-orders:
                        - type
                        - contact_point
                    required:
                    - notification
                    x-apidog-orders:
                    - notification
                  meta:
                    type: object
                    properties:
                      message:
                        type: string
                    required:
                    - message
                    x-apidog-orders:
                    - message
                required:
                - data
                - meta
                x-apidog-orders:
                - data
                - meta
              example: "{\n    \"data\": {\n        \"notification\": {\n            \"type\": \"webhook_low_data\",\n            \"contact_point\": \"https://example.com\"\n        }\n    },\n    \"meta\": {\n        \"message\": \"success\"\n    }\n}"
          headers: {}
          x-apidog-name: Get Low data notification
      security: []
      x-apidog-folder: 'REST API/Endpoints/Notifications/Notification: Low data'
      x-apidog-status: released
      x-run-in-apidog: https://app.apidog.com/web/project/742850/apis/api-11883041-run
