    put:
      summary: Update eSIM brand
      deprecated: false
      description: 'This endpoint allows you to update assigned brand settings name of a specific eSIM from the Airalo Partners API using the eSIM''s ICCID. This brand is used to apply branding on sharing link or share e-mails.If brand is set as null value, eSIM will be shared with unbranded visual.


        The access token, obtained from the "Request Access Token" endpoint, should be included in the request.


        For more information and best practices visit our FAQ page'
