info:
  title: Airalo Partner REST API/Endpoints/Monitor usage API
  description: Airalo Partner API (v2) — assembled verbatim from the per-endpoint OpenAPI 3.0.1 fragments Airalo publishes on its Apidog-hosted developer portal (each endpoint page carries an 'OpenAPI Specification' block). Fragments were merged path-by-path; nothing was authored.
  version: 1.0.0
servers:
- url: https://partners-api.airalo.com
  description: Prod Env
security: []
tags:
- name: REST API/Endpoints/Monitor usage
paths:
  /v2/sims/{sim_iccid}/usage:
    get:
      summary: Get usage (data, text & voice)
      deprecated: false
      description: ':::highlight blue 💡

        This endpoint comes with a rate limit:

        - 10 requests per minute (per unique iccid)

        - 5 requests per second (per unique company)


        A built-in cache of 20 minutes is also set on this endpoint''s response (In Sandbox mode cache is extended to 60 minutes)

        :::


        This endpoint enables you to retrieve the total data, voice & text usage for a specific eSIM identified by its ICCID.


        The access token, obtained from the "Request Access Token" endpoint, should be included in the request.


        **Note for unlimited packages**

        - For unlimited packages the `remaining`, `total` and `amount` fields will default to `0` should be ignored, and not displayed to the end users.

        - When in Sandbox mode, the `is_unlimited` field can be `false` for an unlimited package ordered, due to not having real eSIMs available, thus don''t reflect real usage.


        **Response atttributes units explained:**

        - `total` : Response value is total megabytes on package

        - `remaining` : Response value is in total megabytes **remaining**


        - `total_text` : Response value is the initial total text messages on package

        - `remaining_text` : Response value is in total number of text messages **remaining**


        - `total_voice` : Response value is the initial total voice minutes on package

        - `remaining_voice` : Response value is in total minutes **remaining**'
      tags:
      - REST API/Endpoints/Monitor usage
      parameters:
      - name: sim_iccid
        in: path
        description: The ICCID of the eSIM for which you want to retrieve the data usage details.
        required: true
        example: ''
        schema:
          type: string
      - name: Accept
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      - name: Authorization
        in: header
        description: ''
        required: true
        example: Bearer {{token}}
        schema:
          type: string
      - name: url
        in: header
        description: ''
        example: https://partners-api.airalo.com
        schema:
          type: string
          default: https://partners-api.airalo.com
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      remaining:
                        type: integer
                      total:
                        type: integer
                      expired_at:
                        type: string
                      is_unlimited:
                        type: boolean
                      status:
                        description: 'All Cases: [ NOT_ACTIVE, ACTIVE, FINISHED, UNKNOWN, EXPIRED ]'
                        type: string
                      remaining_voice:
                        type: integer
                      remaining_text:
                        type: integer
                      total_voice:
                        type: integer
                      total_text:
                        type: integer
                    required:
                    - remaining
                    - total
                    - expired_at
                    - is_unlimited
                    - status
                    - remaining_voice
                    - remaining_text
                    - total_voice
                    - total_text
                    x-apidog-orders:
                    - remaining
                    - total
                    - expired_at
                    - is_unlimited
                    - status
                    - remaining_voice
                    - remaining_text
                    - total_voice
                    - total_text
                  meta:
                    type: object
                    properties:
                      message:
                        type: string
                    required:
                    - message
                    x-apidog-orders:
                    - message
                required:
                - data
                - meta
                x-apidog-orders:
                - data
                - meta
              examples:
                '1':
                  summary: 'Get Usage: 200'
                  value: "{\n    \"data\": {\n        \"remaining\": 767,\n        \"total\": 2048,\n        \"expired_at\": \"2022-01-01 00:00:00\",\n        \"is_unlimited\": true,\n        \"status\": \"ACTIVE\", // All Cases: [ NOT_ACTIVE, ACTIVE, FINISHED, UNKNOWN, EXPIRED ]\n        \"remaining_voice\": 0,\n        \"remaining_text\": 0,\n        \"total_voice\": 0,\n        \"total_text\": 0\n    },\n    \"meta\": {\n        \"message\": \"api.succes\"\n    }\n}"
                '2':
                  summary: 'Get Usage: 404 (Invalid ICCID)'
                  value:
                    data: []
                    meta:
                      message: messages.resource_not_found
                '3':
                  summary: 'Get Usage: 429 (Rate Limit)'
                  value:
                    message: Too Many Attempts.
                '4':
                  summary: Success
                  value:
                    data:
                      remaining: 0
                      total: 0
                      expired_at: null
                      is_unlimited: null
                      status: RECYCLED
                      remaining_voice: 0
                      remaining_text: 0
                      total_voice: 0
                      total_text: 0
                    meta:
                      message: api.succes
          headers: {}
          x-apidog-name: 'Get Usage: 200'
        '404':
