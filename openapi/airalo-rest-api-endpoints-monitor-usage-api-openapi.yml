                      is_unlimited:
                        type: 'null'
                      status:
                        type: string
                      remaining_voice:
                        type: integer
                      remaining_text:
                        type: integer
                      total_voice:
                        type: integer
                      total_text:
                        type: integer
                    required:
                    - remaining
