openapi: 3.2.0
info:
  title: Airalo Partner REST API/Endpoints/Compatible devices API
  description: Airalo Partner API (v2) — assembled verbatim from the per-endpoint OpenAPI 3.0.1 fragments Airalo publishes on its Apidog-hosted developer portal (each endpoint page carries an 'OpenAPI Specification' block). Fragments were merged path-by-path; nothing was authored.
  version: 1.0.0
servers:
- url: https://partners-api.airalo.com
  description: Prod Env
security: []
tags:
- name: REST API/Endpoints/Compatible devices
paths:
  /v2/compatible-devices:
    get:
      summary: '[Deprecated] Get compatible device list'
      deprecated: false
      description: ':::warning

        This endpoint is deprecated and will be eventually removed.

        Please use `/v2/compatible-devices-lite` instead.

        :::


        This endpoint provides a comprehensive list of devices that are compatible with eSIMs. Use this information to ensure that your customers have devices that support eSIM functionality.


        #### Important Notes

        - Include the access token, obtained from the **Request Access Token** endpoint, in the request headers to authenticate your API call.

        - The returned list is regularly updated to include the latest compatible devices, ensuring accurate and reliable information for your integration.

        - Use this endpoint to validate device compatibility before processing eSIM orders.'
      tags:
      - REST API/Endpoints/Compatible devices
      parameters:
      - name: Accept
        in: header
        description: ''
        required: true
        example: application/json
        schema:
          type: string
      - name: Authorization
        in: header
        description: ''
        required: true
        example: Bearer {{token}}
        schema:
          type: string
      - name: url
        in: header
        description: ''
        example: https://partners-api.airalo.com
        schema:
          type: string
          default: https://partners-api.airalo.com
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
