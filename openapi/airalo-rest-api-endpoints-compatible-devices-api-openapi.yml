                        model:
                          type: string
                        os:
                          type: string
                        brand:
                          type: string
                        name:
                          type: string
                      required:
                      - model
                      - os
                      - brand
                      - name
                      x-apidog-orders:
                      - model
                      - os
                      - brand
                      - name
                required:
                - data
                x-apidog-orders:
                - data
