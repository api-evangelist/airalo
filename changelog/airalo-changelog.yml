note: >-
  Airalo publishes no dated changelog for the Partner API. Changes are announced inside the documentation
  itself (the v1 deprecation notice in the FAQ, the "[Deprecated]" prefix on the superseded compatible-devices
  endpoint, and "new" feature notes such as direct_apple_installation_url for iOS 17.4+ universal links and
  the min_price object on GET /v2/packages) and through account managers. Recording the absence rather than
  omitting the file: this is a real gap in an otherwise well-documented developer surface.
