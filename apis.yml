apis:
- aid: airalo:airalo-partner-api
  name: Airalo Partner API
  description: REST API (v2) for Airalo partners to browse eSIM packages and product information, place orders
    (synchronous, asynchronous with webhook callback, future-dated, top-ups and eSIM vouchers), retrieve eSIMs,
    installation instructions and package history, monitor data/text/voice usage, update eSIM branding for eSIMs
    Cloud link sharing, request refunds, list compatible devices, check account balance, and opt in/out of webhook
    notifications. Authenticated with a 24-hour bearer token issued by POST /v2/token (OAuth2 client_credentials
    with client_id + client_secret); Sandbox and Production share one base URL and one set of credentials, switched
    by a Partner Platform setting.
  humanURL: https://developers.partners.airalo.com/introduction-752814m0
