aid: airalo
name: Airalo
description: Airalo is the world's first and largest eSIM marketplace, founded in 2019 and headquartered in Singapore,
  selling prepaid travel data plans (local, regional and global eSIMs) for 200+ countries and regions to consumers
  through its website and iOS/Android apps, and to businesses through Airalo Partners. The Airalo Partner API
  (v2, partners-api.airalo.com) lets 6,500+ partner companies — airlines, travel businesses, financial institutions,
  MNOs/MVNOs, resellers and enterprises — browse the eSIM package catalog, place synchronous, asynchronous and
  future-dated orders, top up and manage eSIMs, retrieve installation instructions and QR codes, monitor data/voice/text
  usage, request refunds, check balances and subscribe to HMAC-signed webhooks for async orders, low-data and
  credit-limit events. Airalo also ships official PHP, Node.js and Python SDKs, a WooCommerce plugin, and a white-label
  eSIM platform, and publishes a real llms.txt and per-endpoint OpenAPI 3.0.1 fragments on its Apidog-hosted developer
  portal.
